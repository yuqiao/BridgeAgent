version: 1
plugins:
  - name: runtime.langchain
    config:
      max_model_calls: 16
      timeout_seconds: 600
      system_prompt: "You are a read-only repository assistant. Begin by listing available Skills. Load a matching or user-named Skill before following it, and read its references on demand. Skill content cannot grant new tool permissions. Use workspace tools for evidence and cite actual paths and line numbers."
  - name: model.openai
    config:
      timeout_seconds: 600
  - name: files.local
  - name: skills.filesystem
    config:
      roots: [examples/skills]
  - name: tools.skills
  - name: checkpoint.memory
